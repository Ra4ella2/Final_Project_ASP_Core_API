<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">eMarket</div>
     <div class="h-actions">
      <button class="btn" id="ordersBtn" type="button">Мої замовлення</button>

      <button class="btn" id="cartBtn" type="button">
        Кошик (<span id="cartCount">0</span>)
      </button>

      <div id="userInfo" class="userInfo"></div>
      <button class="btn" id="headerAuthBtn" type="button">Вхід</button>
    </div>
  </header>

  <main class="container">
    <div class="row">
      <h1 class="title">Товари</h1>
    </div>

    <div id="status" class="muted small"></div>
    <div class="price-filter" style="margin-top:12px; gap:8px;">
      <div>
        <input id="minPriceInput" type="number" min="0" step="0.01" placeholder="Ціна від" style="max-width:160px;">
        <input id="maxPriceInput" type="number" min="0" step="0.01" placeholder="Ціна до" style="max-width:160px;">
      </div>
      <div>
        <button class="btn modalbtn" id="priceFilterBtn" type="button">Фільтр</button>
        <button class="btn ghost" id="priceFilterResetBtn" type="button">Скинути</button>
      </div>
    </div>
    <div class="price-filter" style="margin-top:12px; gap:8px;">
      <div>
        <input id="searchInput" type="text" placeholder="Пошук товару по імені" style="max-width:260px;">
      </div>
      <div>
        <button class="btn ghost" id="searchResetBtn" type="button">Скинути пошук</button>
      </div>
    </div>
    <section class="grid" id="productsGrid"></section>
  </main>

  <div class="modal" id="authModal" hidden>
    <div class="modal-backdrop" id="authBackdrop"></div>

    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Акаунт</div>
        <button class="iconbtn" id="authClose" type="button">✕</button>
      </div>

      <form id="authForm" class="form">
        <label>Email
          <input name="email" type="email" required />
        </label>

        <label>Password
          <input name="password" type="password" required />
        </label>

        <div class="row" style="justify-content: flex-end;">
          <button class="btn" id="loginBtn" type="button">Увійти</button>
          <button class="btn" id="registerBtn" type="button">Реєстрація</button>
        </div>

        <div class="hint" id="authMsg"></div>
      </form>
    </div>
  </div>

  <div class="modal" id="cartModal" hidden>
    <div class="modal-backdrop" id="cartBackdrop"></div>

    <div class="modal-card wide">
      <div class="modal-head">
        <div class="modal-title">Кошик</div>
        <button class="iconbtn" id="cartClose" type="button">✕</button>
      </div>

      <div id="cartList" class="list"></div>

      <div class="cart-foot">
        <div class="cart-total">
          Разом: <span id="cartTotal">0</span>
        </div>
        <div class="row end">
          <button class="btn modalbtn" id="checkoutBtn" type="button">Оформити замовлення</button>
        </div>
      </div>

      <div class="hint" id="cartMsg"></div>
    </div>
  </div>

  <div class="modal" id="ordersModal" hidden>
    <div class="modal-backdrop" id="ordersBackdrop"></div>

    <div class="modal-card wide">
      <div class="modal-head">
        <div class="modal-title">Мої замовлення</div>
        <button class="iconbtn" id="ordersClose" type="button">✕</button>
      </div>

      <div class="row end" style="gap:8px; margin: 8px 0 12px;">
        <input id="orderSearchInput" type="number" min="1" placeholder="ID заказа" style="max-width:180px">
        <button class="btn modalbtn" id="orderSearchBtn" type="button">Знайти</button>
        <button class="btn ghost" id="orderSearchResetBtn" type="button">Скинути</button>
      </div>

      <div id="ordersList" class="list"></div>
      <div class="hint" id="ordersMsg"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footerInfo">
      <div class="contactInfo">
        <p>Виконав: Лисенко Руслан Юрійович</p>
        <p>Куратор курсової: Лавренюк Ірина Валеріївна</p>
        <p>Пошта: lysenko_r@dlit.dp.ua</p>
      </div>
    </div>
  </div>

</body>
</html>
